services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: samed_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - samed_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-samed}"
      DB_USERNAME: "${DB_USERNAME:-samed}"
      DB_PASSWORD: "${DB_PASSWORD:-samed}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - samed

  nginx:
    image: nginx:latest
    container_name: samed_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - samed_vendor:/var/www/html/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - samed

  mysql:
    image: mysql:8.0
    container_name: samed_mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-samed}"
      MYSQL_USER: "${DB_USERNAME:-samed}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-samed}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - samed_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - samed

  redis:
    image: redis:7-alpine
    container_name: samed_redis
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - samed

networks:
  samed:
    driver: bridge

volumes:
  samed_mysql_data:
  samed_vendor:
