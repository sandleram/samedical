memory_limit = 1G
date.timezone = "America/Sao_Paulo"
display_errors = On
upload_max_filesize = 50M
post_max_size = 50M
session.gc_probability = 1
session.gc_divisor     = 1000
session.gc_maxlifetime = 7200
max_execution_time = 90
zlib.output_compression = Off
max_input_vars = 1000
max_input_time = 60
asp_tags = Off
allow_url_fopen = On
allow_url_include = On
enable_dl = Off
file_uploads = On
expose_php = Off